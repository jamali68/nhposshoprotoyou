name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deployment mid-flight (prevents deployment lock failures)
concurrency:
  group: 'pages-ci-deploy'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Prevent collision if GitHub's legacy branch-based "pages build and deployment" is still active
      - name: Wait for any conflicting Pages deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 18); do
            ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=10" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);const busy=(j.workflow_runs||[]).filter(r=>r.name==='pages build and deployment'&&(r.status==='in_progress'||r.status==='queued'||r.status==='waiting'));console.log(busy.length);}catch{console.log(0);}})")
            if [ "$ACTIVE" = "0" ]; then
              echo "No conflicting Pages deployment running. Proceeding..."
              break
            fi
            echo "Waiting for legacy GitHub Pages deployment to complete ($i/18)..."
            sleep 5
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
