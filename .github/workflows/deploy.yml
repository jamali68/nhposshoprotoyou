name: CI Build & Netlify Verification

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-verify-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  verify_build:
    name: Build, TypeScript & Netlify Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run lint

      - name: Verify Netlify Functions syntax
        run: |
          for f in netlify/functions/*.js netlify/functions/core/*.js; do
            if [ -f "$f" ]; then
              node --check "$f"
              echo "✅ Verified $f"
            fi
          done

      - name: Build production bundle
        run: npm run build
