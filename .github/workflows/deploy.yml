name: CI Build & GitHub Pages Publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'ci-deploy-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  verify_and_publish:
    name: Build, Verify & Publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run lint

      - name: Verify Netlify Functions syntax
        run: |
          for f in netlify/functions/*.js netlify/functions/core/*.js; do
            if [ -f "$f" ]; then
              node --check "$f"
              echo "✅ Verified $f"
            fi
          done

      - name: Build production bundle
        run: npm run build

      - name: Verify compiled PWA & JS bundle integrity
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/version.json
          ls dist/assets/app-*.js
          echo "✅ Compiled dist/ bundle verified:"
          cat dist/version.json

      - name: Publish fresh build to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: publish fresh build (${{ github.sha }})'

